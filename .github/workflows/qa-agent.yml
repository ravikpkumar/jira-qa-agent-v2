name: Jira QA Agent Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-agent:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Agent
        env:
            JIRA_URL: ${{ secrets.JIRA_URL }}
            EMAIL: ${{ secrets.EMAIL }}
            API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
            python main.py
            
      - name: Upload Executive Report
        uses: actions/upload-artifact@v4
        with:
            name: executive-report
            path: outputs/executive_report.txt

      - name: Upload JSON Test Cases
        uses: actions/upload-artifact@v4
        with:
            name: test-cases-json
            path: outputs/test_cases.json

      - name: Upload Excel Test Cases
        uses: actions/upload-artifact@v4
        with:
            name: test-cases-excel
            path: outputs/test_cases.xlsx
        